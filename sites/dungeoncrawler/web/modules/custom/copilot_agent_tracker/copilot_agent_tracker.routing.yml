copilot_agent_tracker.langgraph_legacy_index:
  path: '/admin/reports/copilot-agent-tracker'
  defaults:
    _controller: '\Drupal\copilot_agent_tracker\Controller\LangGraphConsoleStubController::redirectToOverview'
  requirements:
    _permission: 'administer copilot agent tracker'

