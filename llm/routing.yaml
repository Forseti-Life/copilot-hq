# Execution Routing Configuration
# Controls which live inference backend each agent uses.
#
# Resolution order (first match wins):
#   1. agents.<agent-id>   — per-agent override (only needed when differing from role default)
#   2. roles.<role>        — role-based default
#   3. default             — org-wide fallback
#
# Supported route targets here are:
#   - local-server  (host-local llama.cpp server; primary runtime)
#   - copilot       (explicit fallback/manual override)
#   - <model-id>    (GGUF model from llm/model-manifest.yaml for on-disk runner)
#
# HQ runtime policy is to prefer the host-local llama-server for normal seat
# execution. Copilot remains the only automation fallback backend. On-disk GGUF
# model IDs are still supported but are no longer the default production path.

version: "1"

# Org-wide fallback if no role or agent match.
default: local-server

# Role-based defaults.
# These resolve to the host-local llama.cpp server unless explicitly overridden.
roles:
  ceo: local-server
  architect: local-server
  product-manager: local-server
  project-manager: local-server
  software-developer: local-server
  tester: local-server
  business-analyst: local-server
  security-analyst: local-server

# Agent-specific overrides.
# Only list agents that need a DIFFERENT model/backend than their role default above.
agents: {}
