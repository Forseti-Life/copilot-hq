# Execution Routing Configuration
# Controls which live inference backend each agent uses.
#
# Resolution order (first match wins):
#   1. agents.<agent-id>   — per-agent override (only needed when differing from role default)
#   2. roles.<role>        — role-based default
#   3. default             — org-wide fallback
#
# Supported live backends here are:
#   - copilot
#   - bedrock
#
# Local model routing remains available in the codebase, but HQ runtime policy
# is to route seats to Copilot by default. Bedrock remains an explicit/manual
# override only and should not be selected automatically by orchestration.

version: "1"

# Org-wide fallback if no role or agent match.
default: copilot

# Role-based defaults.
# HQ orchestration should route all seats to Copilot unless a human/operator
# explicitly selects another backend.
roles:
  ceo: copilot
  product-manager: copilot
  software-developer: copilot
  tester: copilot
  business-analyst: copilot
  security-analyst: copilot

# Agent-specific overrides.
# Only list agents that need a DIFFERENT backend than their role default above.
# (qa-*, ba-*, sec-analyst-*, dev-*, pm-*, ceo-* are all handled by role defaults.)
agents:
  # Code review needs the strongest instruction following plus executor-side
  # follow-up recovery when the first draft is not a canonical outbox.
  agent-code-review: copilot

  # Explore agents do summarization/reading, but should still use the default
  # Copilot backend unless explicitly overridden by an operator.
  agent-explore: copilot
  agent-explore-forseti: copilot
  agent-explore-dungeoncrawler: copilot
  agent-explore-infra: copilot
