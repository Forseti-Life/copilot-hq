# Execution Routing Configuration
# Controls which live inference backend each agent uses.
#
# Resolution order (first match wins):
#   1. agents.<agent-id>   — per-agent override (only needed when differing from role default)
#   2. roles.<role>        — role-based default
#   3. default             — org-wide fallback
#
# Supported route targets here are:
#   - deepseek      (DeepSeek API; primary runtime when configured)
#   - local-server  (host-local llama.cpp server; automatic fallback runtime)
#   - copilot       (explicit fallback/manual override)
#   - <model-id>    (GGUF model from llm/model-manifest.yaml for on-disk runner)
#
# HQ runtime policy is to prefer DeepSeek for normal seat execution, then fall
# back to the host-local llama-server when DeepSeek is unavailable. Copilot
# remains the explicit manual fallback backend. On-disk GGUF model IDs are still
# supported but are no longer the default production path.

version: "1"

# Org-wide fallback if no role or agent match.
default: deepseek

# Role-based defaults.
# These resolve to DeepSeek unless explicitly overridden.
roles:
  ceo: deepseek
  architect: deepseek
  product-manager: deepseek
  project-manager: deepseek
  software-developer: deepseek
  tester: deepseek
  business-analyst: deepseek
  security-analyst: deepseek

# Agent-specific overrides.
# Only list agents that need a DIFFERENT model/backend than their role default above.
agents: {}
